<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ATRIUM.EARTH</title>
    <link rel="icon" href="/museumv2/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/museumv2/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/museumv2/apple-touch-icon.png" />
    <meta http-equiv="refresh" content="0; url=/museumv2/museum/" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --text: #e8e4df;
        --muted: #9b948d;
        --line: rgba(255,255,255,0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top right, rgba(200,169,126,0.12) 0%, transparent 28%), var(--bg);
        color: var(--text);
        font-family: "DM Sans", "Avenir Next", sans-serif;
      }

      main {
        max-width: 560px;
        padding: 28px 30px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.02) 100%);
        box-shadow: 0 18px 36px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.05);
      }

      p {
        margin: 0 0 12px;
        line-height: 1.55;
      }

      a {
        color: inherit;
      }
    </style>
    <script>
      window.location.replace("/museumv2/museum/");
    </script>
  </head>
  <body>
    <main>
      <p><strong>ATRIUM.EARTH</strong></p>
      <p>Opening the digital sculpture collection.</p>
      <p><a href="/museumv2/museum/">Open Atrium</a></p>
    </main>
  </body>
</html>
